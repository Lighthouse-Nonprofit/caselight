# bundler-audit ignore list — PRE-EXISTING advisories, each tracked in
# docs/compliance/vulnerability-poam.md with a scheduled remediation. CI (the `security` job in
# .github/workflows/ci.yml) fails on any NEW advisory not listed here.
#
# RULE: never add an ID here without a corresponding POA&M entry + target date.
ignore:
  # POAM-001 — CLOSED (Phase 6): sidekiq 4.1.4 -> 7.3.9. The XSS + 2x DoS advisories no longer
  #             match the lockfile; IDs removed and CI stays green without the ignore.
  # POAM-002 — CLOSED: simple_form 4.1.0 -> 5.4.1. IDs removed (GHSA-r74q-gxcg-73hx, CVE-2019-16676);
  #             the incorrect-access-control advisory no longer matches the lockfile, so CI stays green without the ignore.
  # POAM-011 — CLOSED (Rails 8 rung): webrick LEFT THE BUNDLE entirely — Rack 3 brought
  #             rackup 2.x, which dropped its webrick dependency. The advisory no longer
  #             matches the lockfile; IDs removed (GHSA-h4w6-wx8r-p68v, CVE-2026-38969) and
  #             CI stays green without the ignore.
  # POAM-003 — CLOSED (Phase 6): sinatra REMOVED from the bundle entirely (it existed only as the
  #             sidekiq-4 web-UI dependency, require: false, never mounted). IDs removed.
  # POAM-005a — CLOSED: fixed by the Rails 7.1.5.2 patch (CVE-2025-55193, CVE-2025-24293). IDs removed
  #             from this ignore list; CI stays green because the advisories no longer match the lockfile.
  # POAM-005b — CLOSED: Rails 7.1.5.1 -> 7.2.3.1 cleared the 9 actionview/activestorage/activesupport
  #             2026 CVEs (XSS, path traversal, glob injection, ReDoS, proxy-mode DoS). IDs removed.
  # POAM-006 — CLOSED: bootstrap-sass 3.3.7 -> 3.4.1 (same-major security release). The 6 XSS CVEs
  #             (CVE-2016-10735, CVE-2018-14040/14042/20676/20677, CVE-2019-8331) are all fixed in 3.4.1
  #             and no longer match the lockfile; IDs removed and CI stays green without the ignore.
  # POAM-007 — CLOSED: carrierwave 1.1.0 -> 3.1.3 (+ extension_allowlist migration). IDs removed; the
  #             SSRF/RMagick/content-type CVEs no longer match the lockfile.
  # POAM-008 — CLOSED: unused chartkick gem removed entirely. IDs removed.
  # POAM-009 — CLOSED: devise 4.9.4 -> 5.0.4 (CVE-2026-32700, CVE-2026-40295). IDs removed.
  # POAM-010 — CLOSED: rubocop 0.47.1 -> 1.88.0 (PR #16). IDs removed.
