name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    name: Security scans (SAST + dependency CVEs)
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITHOUT: "staging demo production"
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Brakeman (SAST, --compare against the committed baseline)
        run: mkdir -p tmp && bundle exec brakeman --no-pager --compare config/brakeman_baseline.json -f json -o tmp/brakeman.json
      - name: Fail on NEW Brakeman findings
        # brakeman --compare writes the diff and exits 0, so the gate must parse .new[] itself —
        # without this, a new SAST finding produced a (discarded) report but a GREEN build (Phase 7 fix).
        run: |
          new_count=$(jq '.new | length' tmp/brakeman.json)
          echo "New Brakeman findings vs baseline: $new_count"
          if [ "$new_count" -ne 0 ]; then
            echo "::error::Brakeman found $new_count new finding(s) not in config/brakeman_baseline.json"
            jq -r '.new[] | "  - \(.warning_type) — \(.file):\(.line) — \(.message)"' tmp/brakeman.json
            exit 1
          fi
      - name: Upload Brakeman report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: brakeman-report
          path: tmp/brakeman.json
          if-no-files-found: warn
      - name: bundler-audit (dependency CVEs; ignores tracked in .bundler-audit.yml -> POA&M)
        run: |
          bundle exec bundle-audit update
          bundle exec bundle-audit check

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

  assets:
    name: Assets precompile (production env, mirrors the image build)
    runs-on: ubuntu-latest
    env:
      # Match the production image build exactly (Dockerfile ARG BUNDLE_WITHOUT="development test").
      # Do NOT reuse the test job's "staging demo production" — RAILS_ENV=production Bundler.require
      # needs those groups installed (asset_sync et al.), or the boot fails before precompile starts.
      BUNDLE_WITHOUT: "development test"
    steps:
      - uses: actions/checkout@v7
      - name: System deps (libpq for the pg gem)
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          # Different BUNDLE_WITHOUT than the test job -> segregate the bundle cache.
          cache-version: assets-v1
      - uses: actions/setup-node@v7
        with:
          # execjs/terser runtime; matches the image's pinned Node 24 LTS (Dockerfile).
          node-version: "24"
      - name: assets:precompile (same flags as the Dockerfile precompile step)
        # Dummy creds/flags mirror Dockerfile:56-60 — see the comments there for why each exists
        # (carrierwave/fog eager-load, PRECOMPILE_ASSETS DB-skip, asset_sync upload hook off).
        run: |
          SECRET_KEY_BASE=dummy RAILS_ENV=production PRECOMPILE_ASSETS=true \
          ASSET_SYNC_ENABLED=false \
          AWS_ACCESS_KEY_ID=dummy AWS_SECRET_ACCESS_KEY=dummy \
          FOG_DIRECTORY=dummy FOG_REGION=us-east-1 \
          bundle exec rake assets:precompile
      - name: Assert compiled bundles exist and are non-trivial
        run: |
          js=$(ls public/assets/application-*.js 2>/dev/null | head -1)
          css=$(ls public/assets/application-*.css 2>/dev/null | head -1)
          test -n "$js" || { echo "::error::no compiled application-*.js in public/assets"; exit 1; }
          test -n "$css" || { echo "::error::no compiled application-*.css in public/assets"; exit 1; }
          jsz=$(stat -c%s "$js"); cssz=$(stat -c%s "$css")
          echo "application.js  = ${jsz} bytes ($js)"
          echo "application.css = ${cssz} bytes ($css)"
          [ "$jsz" -gt 100000 ] || { echo "::error::compiled JS suspiciously small (${jsz} bytes)"; exit 1; }
          [ "$cssz" -gt 50000 ] || { echo "::error::compiled CSS suspiciously small (${cssz} bytes)"; exit 1; }

  test:
    name: Test suite (PG 17 / Mongo 8 / Redis)
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      BUNDLE_WITHOUT: "staging demo production"
      DATABASE_NAME_TEST: oscar_test
      DATABASE_USER: oscar
      DATABASE_PASSWORD: testpass
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      HISTORY_DATABASE_HOST: localhost
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY_BASE: ci_only_secret_key_base_not_a_real_secret_0000000000000000000000
      # Mailer addresses: mailers read from/to from ENV (ApplicationMailer `default from: ENV['SENDER_EMAIL']`,
      # AbleScreeningMailer `to: ENV['ABLE_MANAGER_EMAIL']`). Unset -> blank from -> ArgumentError on deliver_now.
      # CI-only placeholder addresses, not secrets.
      SENDER_EMAIL: ci-noreply@example.test
      DEV_EMAIL: ci-dev@example.test
      ABLE_MANAGER_EMAIL: ci-able@example.test
      CIF1_EMAIL: ci-cif1@example.test
      CIF2_EMAIL: ci-cif2@example.test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: oscar
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: oscar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oscar" --health-interval 5s --health-timeout 5s --health-retries 20
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7   # sidekiq 7's redis-client needs Redis server >= 6.2
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - name: System deps (libpq for the pg gem)
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Load test schema
        run: bundle exec rails db:schema:load
      # POAM-017e (R9c): dart-sass builds the stylesheet OUTSIDE sprockets. Request/view
      # specs render layouts whose stylesheet_link_tag resolves app/assets/builds/
      # application.css — on a fresh checkout that file doesn't exist and sprockets would
      # fall back to the raw .scss (which the no-ruby-sass shim fails loudly on).
      - name: Build the dart-sass stylesheet
        run: bundle exec rails dartsass:build
      - name: RSpec (non-feature suite)
        run: bundle exec rspec spec/models spec/serializers spec/decorators spec/helpers spec/mailers spec/requests spec/controllers spec/lib spec/services spec/views spec/schedule_spec.rb
