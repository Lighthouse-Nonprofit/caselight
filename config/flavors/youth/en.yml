# Youth Development flavor overlay (One Community Action).
# Same contract as the resettlement overlay: loads AFTER config/locales/, wins the
# merge, root key `en:`, restart-only reload in dev. Every key here must either
# override an existing base key or live under flavor.* (spec-enforced) — keep
# entries minimal and deletable.
#
# 2026-08: OCA now serves adults + families alongside youth, so the client/household
# NOUNS were reverted to the neutral base ("Individuals" / "Households") — those keys
# were deleted here so the base wins. What remains is OCA's genuine flavor identity
# (program name, service-contact language) plus a demographics tweak, none of which is
# a client-noun.
en:
  flavor:
    name: Youth Development
  dashboards:
    index:
      title: Youth Development Dashboard
      tile_check_ins: SERVICE CONTACTS THIS MONTH
  reports:
    registry:
      demographics:
        description: Race and ethnicity, preferred language, school, grade, poverty level, age and gender of those served.
