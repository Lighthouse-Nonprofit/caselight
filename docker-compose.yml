# docker-compose.yml - CaseLight pilot stack (Ruby 4.0 / Rails 8.0 / Mongo 8.0 / Postgres 17).
# Datastores are NOT published to the host; the app is published only on 127.0.0.1:3000
# (reach it via the SSM/SSH tunnel). For public HTTPS, enable the Dockerized "caddy"
# service via the "proxy" profile (set APP_HOST in .env first). See OPERATIONS.md / SECURITY.md.

services:
  db:
    # postgres:17 (migrated from 9.6 via dump/restore). PG data dirs are incompatible across major
    # versions, so a major bump means: dump -> wipe the volume -> fresh image -> pg_restore (not an
    # in-place image swap). See the postgres-migration playbook / OPERATIONS.md.
    image: postgres:17
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes: [pg:/var/lib/postgresql/data]
    restart: unless-stopped

  mongo:
    # mongo:8.0 (migrated from 6.0 via dump/restore, same playbook as postgres above): an
    # in-place 6->8 image swap does NOT work — mongod refuses to start unless the data files'
    # featureCompatibilityVersion is walked 6->7->8 one major at a time. A fresh volume starts
    # at FCV 8.0 directly, so a major bump means: mongodump --archive -> wipe the volume ->
    # fresh image -> mongorestore (see the Rung C runbook / OPERATIONS.md). Mongoid 9 supports
    # server 3.6-8.2.
    image: mongo:8.0
    # Cap WiredTiger's cache (default = ~50% of host RAM) — this box shares its memory with
    # Postgres, Redis, the app and sidekiq, and the history store is tiny. 0.25 GB is mongod's
    # documented minimum.
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes: [mongo:/data/db]
    restart: unless-stopped

  redis:
    # redis 7: sidekiq 7's redis-client requires Redis server >= 6.2 (HELLO/RESP3). RDB is
    # forward-compatible (7 loads 5's dump) and the redis volume holds only transient queue +
    # throttle counters anyway.
    image: redis:7
    volumes: [redis:/data]
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    depends_on: [db, mongo, redis]
    ports: ["127.0.0.1:3000:3000"]
    # Persist locally-stored documents (CarrierWave :file -> public/uploads) across
    # rebuilds/redeploys. Without this, every `docker compose build && up` wipes them.
    # The named volume lives on the host's (encrypted) EBS volume; cover it in EBS
    # snapshots. Shared with sidekiq so background jobs see the same files.
    volumes: [uploads:/app/public/uploads]
    restart: unless-stopped

  sidekiq:
    build: .
    env_file: .env
    depends_on: [db, mongo, redis]
    command: bundle exec sidekiq -e production
    volumes: [uploads:/app/public/uploads]
    restart: unless-stopped

  # Optional TLS-terminating reverse proxy. Off by default (profile "proxy"); enable with
  #   docker compose --profile proxy up -d caddy
  # once APP_HOST is set in .env, DNS points APP_HOST at this box, and the security group
  # allows inbound 80/443. Caddy then auto-provisions a Let's Encrypt cert for APP_HOST.
  caddy:
    image: caddy:2
    profiles: ["proxy"]
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      APP_HOST: ${APP_HOST:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  pg: {}
  mongo: {}
  redis: {}
  uploads: {}
  caddy_data: {}
  caddy_config: {}
